name: Bug report
description: Report a reproducible problem with the runner or dashboard
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove secrets, tokens, and private
        repository details before submitting. Security issues should follow
        SECURITY.md instead of this form.
  - type: input
    id: version
    attributes:
      label: Runner version
      description: Release tag, container image tag, or commit SHA.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, and Docker Engine version.
      placeholder: Ubuntu 24.04, amd64, Docker 27.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure project ...
        2. Push commit ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or configuration
      description: Sanitise secrets and private data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
