name: Feature request
description: Suggest an improvement that fits the project's lightweight scope
title: "[feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        This project deliberately stays small. Explain the problem first, then
        the smallest change that would solve it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Webhook ingestion
        - Pipeline and Docker execution
        - Database and API
        - Dashboard
        - Deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions for duplicates.
          required: true
